# The quick start from the README. Settings: docs/configuration.md.
services:
  slopify:
    image: ghcr.io/lukasbaxter/slopify:latest
    container_name: slopify
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "50m", max-file: "5" } }  # the log would otherwise grow without bound
    # Host networking so the server can find Chromecast / BluOS speakers and
    # announce itself to Home Assistant. Docker's default network
    # (ports: ["8080:8080"]) works for everything else.
    network_mode: host
    volumes:
      - /path/to/music:/music:ro   # drop :ro with SAVE_TO_LIBRARY=1
      - ./data:/data               # database and caches (the one thing to back up)
    environment:
      PORT: "8080"
      TZ: Europe/London        # your time zone, for scheduled tasks
      # LANGUAGE: "de"           # app language for everyone (default: each device's own); see docs/configuration.md
      # PUID: "1000"               # the user it runs as; /data is set up for it
      # PGID: "1000"
      # SAVE_TO_LIBRARY: "1"       # write found lyrics/artwork next to your files
      # PUBLIC_URL: http://192.168.1.10:8080  # if the speakers' address in the log is wrong
