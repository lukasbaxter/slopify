# Build and push both images to GHCR on every push to main and on v* tags:
# the slim one as :latest (+ :vX.Y.Z) for amd64 and arm64, the GPU one (lyric
# aligner) as :gpu (+ :vX.Y.Z-gpu) for amd64. Each push is also tagged
# sha-<commit> so the smoke job installs exactly what was built, on a real
# machine of each architecture. CI (ci.yml) still builds the slim image on PRs.
name: docker
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: runtime
            suffix: ''
            latest: latest
            platforms: linux/amd64,linux/arm64
          - target: gpu
            suffix: '-gpu'
            latest: gpu
            platforms: linux/amd64
    steps:
      # The gpu image is ~6 GB; the runner's default free space is tight.
      - name: Free disk space
        if: matrix.target == 'gpu'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: contains(matrix.platforms, 'arm64')
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/lukasbaxter/slopify
          tags: |
            type=raw,value=${{ matrix.latest }}
            type=ref,event=tag,suffix=${{ matrix.suffix }}
            type=sha,prefix=sha-,suffix=${{ matrix.suffix }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # A first install as the README describes it, on each architecture.
  smoke:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: tools/smoke-install.sh ghcr.io/lukasbaxter/slopify:sha-${GITHUB_SHA::7}
