plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.lukasbaxter.slopify'
version = '0.1.0'

android {
  namespace "expo.modules.slopifymedia"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'androidx.media:media:1.7.0'
  implementation 'androidx.core:core-ktx:1.13.1'
}
