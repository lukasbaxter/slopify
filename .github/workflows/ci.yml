name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libchromaprint-tools
      - run: npm ci
      - run: npm run lint
      - run: npm run licenses && git diff --exit-code docs/THIRD_PARTY_LICENSES.md
      - run: npm run fixtures
      - run: npm test
      # The release scripts and the desktop app's updater and transports
      # (stand-ins for gh, Electron and Cast: no install needed).
      - run: for t in tools/tests/*.test.sh; do bash "$t" || exit 1; done
      - run: node --test electron/*.test.js
        working-directory: desktop
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t slopify:ci .
      - run: docker run --rm slopify:ci node -e "console.log('image ok')"
