# Generated Xcode project: run `make gen` (XcodeGen). The .xcodeproj is not
# committed, so parallel work never fights over project.pbxproj; every file
# under Slopify/ is picked up by folder.
name: Slopify
options:
  bundleIdPrefix: com.lukasbaxter
  deploymentTarget: { iOS: "18.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
targets:
  Slopify:
    type: application
    platform: iOS
    sources:
      - path: Slopify
    resources: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukasbaxter.slopify.native
        PRODUCT_NAME: Slopify
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Slopify/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SlopifyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SlopifyTests]
    dependencies: [{ target: Slopify }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Slopify.app/Slopify
schemes:
  Slopify:
    build: { targets: { Slopify: all, SlopifyTests: [test] } }
    test: { targets: [SlopifyTests] }
