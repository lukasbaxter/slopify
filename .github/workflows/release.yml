# Tag v* -> build the desktop apps (dmg, exe) and the Android APK and attach
# them to a GitHub Release. Unsigned (no developer accounts): macOS users right-click > Open
# once (the dmg is ad-hoc signed so Gatekeeper offers that instead of
# "damaged"), Windows users click through SmartScreen.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            # the dmg to install, the zip for in-app updates (desktop/electron/updater.js)
            glob: |
              desktop/release/*.dmg
              desktop/release/*-mac.zip
          - os: windows-latest
            script: dist:win
            glob: 'desktop/release/*.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # No server address is built in: the public apps ask for yours.
      - run: npm run build -w web
      - run: npm ci
        working-directory: desktop
      # The app version is the tag (v0.1.1 -> 0.1.1).
      - if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
        working-directory: desktop
        shell: bash
      # --publish never: electron-builder otherwise tries to upload to GitHub itself on a tag.
      - run: npm run ${{ matrix.script }} -- --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
  # The native Android app (android/), signed with the key the Expo app used and
  # under its id, so it installs as an update over it (owner, 11-12).
  android:
    runs-on: ubuntu-latest
    # Skips cleanly (every step guarded) when the keystore secret isn't set,
    # e.g. on forks, so publish isn't held up by a build that can't sign.
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - name: Keystore secret present?
        run: echo "ANDROID_KEYSTORE_B64 set:" "$HAS_KEYSTORE"
      - uses: actions/checkout@v4
        if: env.HAS_KEYSTORE == 'true'
      - uses: actions/setup-java@v4
        if: env.HAS_KEYSTORE == 'true'
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_KEYSTORE == 'true'
      - name: Keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/slopify-release.jks"
      # The app's version is the tag (v0.1.179 -> 0.1.179, versionCode 1179).
      - run: ./gradlew :app:assembleRelease --no-daemon -PslopifyVersion="${GITHUB_REF_NAME#v}"
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          SLOPIFY_KEYSTORE: ${{ runner.temp }}/slopify-release.jks
          CONDUIT_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      - run: cp android/app/build/outputs/apk/release/app-release.apk Slopify-${GITHUB_REF_NAME#v}.apk
        if: env.HAS_KEYSTORE == 'true'
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: android
          path: Slopify-*.apk
          if-no-files-found: error
  # The iPhone app, unsigned, for SideStore / AltStore (they sign it on the
  # phone), plus the source SideStore reads to offer it as an update. The
  # source is a release asset, so its address never changes:
  # releases/latest/download/sidestore-source.json
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mobile/build-ipa.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: mobile/dist/*
          if-no-files-found: error
  publish:
    # always() so a broken/skipped android or ios job never blocks the desktop
    # artifacts from reaching the release; desktop itself must have passed.
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.desktop.result == 'success'
    steps:
      # The whole history and tags: the notes list the commits since the last tag.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: ls -la out
      # Attaches the files one at a time with retries, then writes the notes
      # from what the release really has, on every run (a re-run after a
      # failed Android or iPhone job updates them too).
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/publish-release.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" out
