# Tag v* -> build the desktop apps (dmg, exe) and the Android APK and attach
# them to a GitHub Release. Unsigned (no developer accounts): macOS users right-click > Open
# once (the dmg is ad-hoc signed so Gatekeeper offers that instead of
# "damaged"), Windows users click through SmartScreen.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            glob: 'desktop/release/*.dmg'
          - os: windows-latest
            script: dist:win
            glob: 'desktop/release/*.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w web
      - run: npm ci
        working-directory: desktop
      # The app version is the tag (v0.1.1 -> 0.1.1).
      - if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
        working-directory: desktop
        shell: bash
      # --publish never: electron-builder otherwise tries to upload to GitHub itself on a tag.
      - run: npm run ${{ matrix.script }} -- --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    # Skips cleanly (every step guarded) when the keystore secret isn't set,
    # e.g. on forks, so publish isn't held up by a build that can't sign.
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - name: Keystore secret present?
        run: echo "ANDROID_KEYSTORE_B64 set:" "$HAS_KEYSTORE"
      - uses: actions/checkout@v4
        if: env.HAS_KEYSTORE == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_KEYSTORE == 'true'
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        if: env.HAS_KEYSTORE == 'true'
        with: { distribution: temurin, java-version: '17' }
      # ubuntu-latest ships the Android SDK; only the licences need accepting so
      # Gradle can pull the platform/build-tools Expo asks for.
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
        if: env.HAS_KEYSTORE == 'true'
      - run: npm ci
        if: env.HAS_KEYSTORE == 'true'
        working-directory: mobile
      - run: npx expo prebuild --platform android --no-install
        if: env.HAS_KEYSTORE == 'true'
        working-directory: mobile
        env: { CI: '1' }
      - name: Signing config
        if: env.HAS_KEYSTORE == 'true'
        working-directory: mobile/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > app/slopify-release.jks
          # Point the release build at our keystore (Expo's template signs
          # release with the debug key). Re-opening the android {} block is
          # additive in the Android Gradle DSL; values come from the environment.
          cat >> app/build.gradle <<'EOG'

          android {
              signingConfigs {
                  release {
                      storeFile file("slopify-release.jks")
                      storePassword System.getenv("CONDUIT_KS_PASS")
                      keyAlias "conduit"
                      keyPassword System.getenv("CONDUIT_KS_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOG
      - run: ./gradlew assembleRelease --no-daemon
        if: env.HAS_KEYSTORE == 'true'
        working-directory: mobile/android
        env:
          CONDUIT_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      - run: cp mobile/android/app/build/outputs/apk/release/app-release.apk Slopify-${GITHUB_REF_NAME#v}.apk
        if: env.HAS_KEYSTORE == 'true'
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: android
          path: Slopify-*.apk
          if-no-files-found: error
  # The iPhone app, unsigned, for SideStore / AltStore (they sign it on the
  # phone), plus the source SideStore reads to offer it as an update. The
  # source is a release asset, so its address never changes:
  # releases/latest/download/sidestore-source.json
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mobile/build-ipa.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: mobile/dist/*
          if-no-files-found: error
  publish:
    # always() so a broken/skipped android or ios job never blocks the desktop
    # artifacts from reaching the release; desktop itself must have passed.
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.desktop.result == 'success'
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: ls -la out
      # Uploads one file at a time with retries: GitHub's asset upload API
      # dropped parallel uploads of these ~100 MB files ("other side closed",
      # "Error creating asset temp dir") on the first two releases.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --generate-notes
          for f in out/*; do
            for i in 1 2 3 4 5; do gh release upload "$GITHUB_REF_NAME" "$f" -R "$GITHUB_REPOSITORY" --clobber && break || sleep 15; done
          done
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'
